[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = WARNING
addopts = -m "not integration"
markers =
    integration: calls the REAL Gemini API (needs GEMINI_API_KEY, uses quota); run with: pytest -v -m integration
