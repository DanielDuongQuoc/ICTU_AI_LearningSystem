# ICTU_AI_LearningSystem - Module 3
#
#   api - FastAPI application (port 8003). LLM + embeddings: Google Gemini API (GEMINI_API_KEY from .env).
#
# Usage: see README ("Docker").

# Phase 22: container logs are written to the Docker json-file driver, which never rotates by default.
# Cap them so logs cannot fill the disk (about 50 MB per container).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: module3_api
    restart: unless-stopped
    logging: *default-logging
    # Time for uvicorn to finish in-flight requests/streams on SIGTERM and close clients.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # API_BIND=127.0.0.1 keeps the API off the network (use behind a reverse proxy).
      - "${API_BIND:-0.0.0.0}:8003:8003"
    env_file:
      - path: .env
        required: false
    environment:
      # Values below override .env (which uses localhost for local, non-Docker runs).
      - APP_HOST=0.0.0.0
      - APP_PORT=8003
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
    volumes:
      - chroma_data:/app/data/chroma
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8003/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  chroma_data:
  uploads_data:
